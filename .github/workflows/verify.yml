name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/verify.sh
      - run: python -m pip install 'build==1.3.0' 'setuptools==80.9.0' 'wheel==0.45.1'
      - run: python -m build --no-isolation
      - run: |
          python -m venv "$RUNNER_TEMP/glassbox-installed"
          "$RUNNER_TEMP/glassbox-installed/bin/python" -m pip install --no-index --no-deps dist/*.whl
          python scripts/check_installed.py "$RUNNER_TEMP/glassbox-installed/bin/python"
