<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">GlassBox pipeline: interface layouts to measured answers</title>
<desc id="pipeline-desc">Load scenario values, questions, and study settings. Build a raw-data table and plain-text baseline plus cards, table, and annotated views. Run glassbox validate separately to recompute answer keys before evaluation. Simulated readers use structured visible fields; API readers use screenshots or text. Score choices against stored keys, calculate accuracy and lift over the plain-text baseline, and retain raw-table accuracy as a reference. A separate judge uses fixed feature ratings or API text comparisons of the test views. Compare judge and accuracy rankings, then write Markdown and JSON results with answers, metrics, and provenance hashes. Optional repair, feature search, and human-accuracy comparison run their own evaluations using the same tasks and readers. The shipped demonstration uses synthetic data, simulated readers, and a simulated judge.</desc>
<defs>
<marker id="main-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#55c4e0"/></marker>
<marker id="judge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#bb9af7"/></marker>
</defs>
