<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">GlassBox pipeline</title>
<desc id="pipeline-desc">Read the main study from left to right. Scenario data, multiple-choice questions, and study settings feed four steps: build interface views, collect reader answers, score answer accuracy and lift, and compare rankings before saving report.md and results.json. Default views are the raw table and plain-text reference layouts plus cards, table, and annotated test layouts. Simulated readers use structured presentation fields; API readers use screenshots or interface text. Accuracy compares choices with stored answer keys, and lift subtracts plain-text baseline accuracy. A separate judge rates only the test views using fixed feature ratings or API text comparisons. Its scores join answer accuracy only at the ranking comparison. Validation, repair, feature search, and comparison with supplied human accuracy are separate commands, not stages of the study. The shipped offline demo uses three synthetic scenarios, nine questions, simulated readers, and a simulated judge. Shipped human accuracy values are also synthetic.</desc>
